name: Build MH SOLAR Play Store AAB
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Generate upload keystore
        run: |
          keytool -genkeypair -noprompt -keystore android/app/mhsolar-upload.jks -alias mhsolar -keyalg RSA -keysize 2048 -validity 10000 -storepass 'MHsolar2026!' -keypass 'MHsolar2026!' -dname 'CN=MH SOLAR, OU=Daily Rates, O=MH SOLAR, L=Sialkot, ST=Punjab, C=PK'

      - name: Build signed Play Store AAB
        working-directory: android
        run: gradle --no-daemon :app:bundleRelease

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: MH-SOLAR-DAILY-RATES-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload upload-key backup
        uses: actions/upload-artifact@v4
        with:
          name: MH-SOLAR-UPLOAD-KEY-BACKUP
          path: android/app/mhsolar-upload.jks
          if-no-files-found: error
