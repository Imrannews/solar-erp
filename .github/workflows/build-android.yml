name: Build MH SOLAR Play Store AAB
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate upload keystore
        working-directory: android/app
        run: |
          keytool -genkeypair -v -keystore mhsolar-upload.jks -alias mhsolar -keyalg RSA -keysize 2048 -validity 10000 -storepass 'MHsolar2026!' -keypass 'MHsolar2026!' -dname 'CN=MH SOLAR, OU=Daily Rates, O=MH SOLAR, L=Sialkot, C=PK'
      - name: Build signed release AAB
        working-directory: android
        run: gradle bundleRelease
      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: MH-SOLAR-DAILY-RATES-PLAY-STORE-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Upload upload-key backup
        uses: actions/upload-artifact@v4
        with:
          name: MH-SOLAR-UPLOAD-KEY-BACKUP
          path: android/app/mhsolar-upload.jks
