plugins { id 'com.android.application' }

android {
    namespace 'com.mhsolar.dailyrates'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mhsolar.dailyrates'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('MH_KEYSTORE_FILE') ?: 'mhsolar-upload.jks')
            storePassword System.getenv('MH_KEYSTORE_PASSWORD') ?: 'MHsolar2026!'
            keyAlias System.getenv('MH_KEY_ALIAS') ?: 'mhsolar'
            keyPassword System.getenv('MH_KEY_PASSWORD') ?: 'MHsolar2026!'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:24.0.0'
}
